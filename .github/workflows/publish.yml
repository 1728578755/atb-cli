name: Publish npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 连发两个 tag 时不要并发发布：两条流水线会争同一批 npm 版本号与同一个 Release，
# 后到的那个 `--clobber` 会把先发的附件覆盖掉。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # npm publish --provenance 用 OIDC 签署来源证明，缺这个权限会直接 403。
  id-token: write

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check package.json / Cargo.toml / docs / tag
        shell: bash
        run: |
          set -euo pipefail
          # Cargo.toml 落后于 package.json 时，二进制自报版本会和发布版本不一致，
          # 这类漂移必须在发布前拦住，而不是等用户发现。
          # CLI 与扩展是两条版本线，--check 默认两条都校验：
          # 文档里的扩展版本串对不上 manifest 一样会让用户按文档装错版本。
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            node scripts/sync-version.mjs --check
            echo "非 tag 触发，校验 CLI 与扩展的版本一致性"
            exit 0
          fi
          tag="${{ github.ref_name }}"
          tag="${tag#v}"
          if [[ "${tag}" == *-extension ]]; then
            # 扩展 tag 不发 npm 包，但扩展文档必须与 manifest 一致，否则 Release 里的
            # 压缩包和 AI_INSTALL/SECURITY 说的版本对不上。
            node scripts/sync-version.mjs --check --ext
            echo "extension tag：已校验扩展版本串"
            exit 0
          fi
          node scripts/sync-version.mjs --check --expect "${tag}"

      # / ：以下门禁以前只在 ci.yml 跑，而 ci.yml 与 publish 是并行触发的，
      # tag 又不受分支保护约束 —— 锁文件漂移、扩展资产不同步、单测红都能照样发版。
      # 全部前移到 npm publish 之前，失败即停。
      - name: 扩展 JS 语法（assets/atb_bridge 全量，含 options 与 ui/）
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find assets/atb_bridge -name '*.js' -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::assets/atb_bridge 下没有找到任何 .js"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "${file}"
          done
          echo "已校验 ${#files[@]} 个扩展脚本"

      # 的同一份检查：tag 里的主副本与 ops/ 不一致时，npm 包（prepack 会重写 ops）
      # 与 Release 里的扩展 zip 就是两个东西，必须发版前拦住。
      - name: 扩展资产一致性（主副本 vs ops）
        run: node scripts/sync-extension-assets.mjs --check

      # 锁文件门禁。默认模式允许「刚 bump、平台包还没上架」的临时缺 integrity；
      # 严格模式在平台包发布之后单独跑（verify-platform-integrity）。
      - name: 锁文件一致性（check-lock）
        run: node scripts/check-lock.mjs

      # 与 ci.yml 的 node-tests 同一条命令：发布前必须全绿。
      - name: Node 回归测试（tests/*.test.mjs）
        run: node --test tests/*.test.mjs

  platforms:
    name: Platform matrix
    runs-on: ubuntu-latest
    outputs:
      # 平台清单唯一真相源在 scripts/platforms.json：matrix 由脚本生成，
      # 不再在 YAML 里手抄一份，避免「package.json 有该平台包、matrix 不构建它」。
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: emit
        run: echo "matrix=$(node scripts/platforms.mjs --matrix)" >> "$GITHUB_OUTPUT"

  publish-binaries:
    name: Publish ${{ matrix.name }}
    if: ${{ !contains(github.ref_name, '-extension') }}
    needs: [version-check, platforms]
    runs-on: ${{ matrix.os }}
    environment: npm
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        shell: bash
        run: npm install -g npm@11.5.1

      # --locked：不带它时 cargo 会在 runner 上就地更新 Cargo.lock，用新解析的依赖版本
      # 出二进制，npm 上发布的产物与仓库锁定的依赖集不一致。
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin-artifact
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
             "dist/bin-artifact/${{ matrix.target }}-${{ matrix.binary }}"

      - name: Stage platform package
        run: node scripts/package-platform.mjs ${{ matrix.name }} target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Pack platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/npm
          npm pack "npm/platform/${{ matrix.name }}" --pack-destination dist/npm

      - name: Publish platform package
        shell: bash
        working-directory: npm/platform/${{ matrix.name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            NPM_TAG="${NPM_TAG:-beta}"
          else
            NPM_TAG="${NPM_TAG:-latest}"
          fi
          # 只有「确实已经发布过」才允许跳过。以前用 `npm view` 兜底：
          # 网络抖动 / 权限不足时 view 也失败，脚本却按 exit 0 收场，把真实发布失败
          # 吞成「已发布」。现在只认 npm 自己的错误码与原文。
          # --provenance：让 npm 用 OIDC 签署来源证明，用户可追溯 tarball 出自哪次 workflow。
          set +e
          output="$(npm publish --access public --provenance --tag "${NPM_TAG}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [[ ${status} -eq 0 ]]; then
            exit 0
          fi
          if printf '%s\n' "${output}" | grep -Eq 'E403|already exists|cannot publish over the previously published versions?'; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} 已发布过（npm 返回「已存在」），跳过"
            exit 0
          fi
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} 发布失败（exit=${status}）"
          exit "${status}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: atb-${{ matrix.name }}
          # 每个平台都把二进制重命名成 <target>-atb[.exe] 再上传：四个 artifact 内部同名
          # `atb` 在 merge-multiple 后会互相覆盖，Release 里只剩两份文件，用户装到错的架构。
          path: dist/bin-artifact/${{ matrix.target }}-${{ matrix.binary }}

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.name }}
          path: dist/npm/*.tgz

  # / / ：平台包发布完成之后、主包发布之前，用 registry 上的真实哈希核对 lock。
  # 平台包是原生二进制，npm ci 对 optionalDependency 不做内容校验 —— 这是供应链里最该
  # 锁哈希的工件，缺 integrity 就必须在这里停住，而不是发到用户机器上。
  verify-platform-integrity:
    name: Verify platform integrity
    if: ${{ !contains(github.ref_name, '-extension') }}
    needs: publish-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      # 严格门禁：lock 里缺 integrity 直接失败；--registry 再与 registry 的 dist.integrity
      # 逐条比对（脚本内部对 404/网络抖动有重试，容忍刚 publish 的元数据延迟）。
      # 失败时的修法：本地跑 `node scripts/fill-lock-integrity.mjs` 提交 lock 后重跑发布
      # （平台包已存在会自动跳过）。
      - name: 严格 integrity + registry 比对
        run: node scripts/check-lock.mjs --strict-integrity --registry

  publish-main:
    name: Publish main package
    if: ${{ !contains(github.ref_name, '-extension') }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    needs: [publish-binaries, verify-platform-integrity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Publish main package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            NPM_TAG="${NPM_TAG:-beta}"
          else
            NPM_TAG="${NPM_TAG:-latest}"
          fi
          set +e
          output="$(npm publish --access public --provenance --tag "${NPM_TAG}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "${output}"
          if [[ ${status} -eq 0 ]]; then
            exit 0
          fi
          if printf '%s\n' "${output}" | grep -Eq 'E403|already exists|cannot publish over the previously published versions?'; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} 已发布过（npm 返回「已存在」），跳过"
            exit 0
          fi
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} 发布失败（exit=${status}）"
          exit "${status}"

  github-release:
    name: GitHub Release
    # 以前只依赖 publish-binaries，且把 `skipped` 当成功 —— 版本门禁失败
    # 或 npm 主包发布失败时照样产出 Release，用户下到与 tag 不符 / npm 上不存在的版本。
    # 现在三条依赖都必须成功；扩展专用 tag（*-extension）没有 npm 包，单独走一条分支。
    needs: [version-check, publish-binaries, publish-main]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.version-check.result == 'success' && (contains(github.ref_name, '-extension') || (needs.publish-binaries.result == 'success' && needs.publish-main.result == 'success')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 附注 tag 的说明就是 Release notes 的来源；浅克隆只有 commit，
          # `git tag --format='%(contents)'` 会退化成 commit 标题。
          # fetch-depth: 0 只保证历史完整；tag 对象仍需显式抓取，否则
          # `%(contents)` 仍可能退化成 commit 标题（0.8.0 实测）。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Report skipped dependencies
        shell: bash
        run: |
          echo "version-check:   ${{ needs.version-check.result }}"
          echo "publish-binaries: ${{ needs.publish-binaries.result }}"
          echo "publish-main:    ${{ needs.publish-main.result }}"

      - name: Download binary artifacts
        if: ${{ !contains(github.ref_name, '-extension') }}
        uses: actions/download-artifact@v4
        with:
          pattern: atb-*
          path: dist/bin
          merge-multiple: true

      - name: Download npm package artifacts
        if: ${{ !contains(github.ref_name, '-extension') }}
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/npm
          merge-multiple: true

      # ：扩展资产一致性检查已前移到 `version-check`——放在这里时
      # npm 主包已经发出去了，tag 里 ops/ 不一致只会变成「npm 有、Release 缺 zip」。
      - name: Package Chrome extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/chrome-extensions.zip
          # 压缩包根目录直接放扩展文件，拖入浏览器扩展页即可安装。
          (cd assets/atb_bridge && zip -r ../../dist/chrome-extensions.zip .)

      # ：Release 产物给校验和，用户下载后能确认拿到的是本次构建的东西。
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          : > SHA256SUMS
          while IFS= read -r file; do
            sha256sum "${file}" >> SHA256SUMS
          done < <(find bin npm -type f 2>/dev/null | sort)
          [[ -f chrome-extensions.zip ]] && sha256sum chrome-extensions.zip >> SHA256SUMS
          cat SHA256SUMS

      # / 0：可选 GPG 分离签名。仓库拿不到私钥是常态（fork、本地 workflow_dispatch），
      # 所以不能硬性要求 —— 但「没签」和「签了」必须在 Release notes 里区分开，
      # 否则用户会把「没有 .asc」当成「签名丢了」。
      - name: Sign SHA256SUMS（未配置密钥则跳过）
        id: sign
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "未配置 GPG_PRIVATE_KEY，跳过签名（Release notes 会标注 unsigned）"
            echo "::notice::未配置 GPG_PRIVATE_KEY，SHA256SUMS 仅提供哈希、未签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "${key_id}" ]; then
            echo "::error::GPG_PRIVATE_KEY 导入成功但读不到指纹"
            exit 1
          fi
          # --armor：Release 附件里放文本 .asc，用户肉眼能看出这是签名而不是二进制。
          args=(--batch --yes --armor --detach-sign --local-user "${key_id}" --output dist/SHA256SUMS.asc)
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf '%s' "${GPG_PASSPHRASE}" | gpg "${args[@]}" --pinentry-mode loopback --passphrase-fd 0 dist/SHA256SUMS
          else
            gpg "${args[@]}" dist/SHA256SUMS
          fi
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "key_id=${key_id}" >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=()
          if [ -d dist/bin ]; then
            while IFS= read -r file; do release_assets+=("${file}"); done < <(find dist/bin -type f | sort)
          fi
          if [ -d dist/npm ]; then
            while IFS= read -r file; do release_assets+=("${file}"); done < <(find dist/npm -type f -name '*.tgz' | sort)
          fi
          extension_package="dist/chrome-extensions.zip"
          release_assets+=("${extension_package}")
          release_assets+=("dist/SHA256SUMS")
          # 有签名才上传 .asc：没有密钥时不能放一个空文件让用户以为签名存在。
          if [ -f dist/SHA256SUMS.asc ]; then
            release_assets+=("dist/SHA256SUMS.asc")
            verification_note="校验：SHA256SUMS 已用 GPG 分离签名，公钥指纹 ${{ steps.sign.outputs.key_id }}，见 SHA256SUMS.asc。"
          else
            verification_note="校验：只提供 SHA256SUMS 哈希，本次未做 GPG 签名（发布环境未配置 GPG_PRIVATE_KEY）。"
          fi
          TAG_MESSAGE="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' | sed '${/^$/d;}')"
          # push tag 时 GitHub 可能自动生成 draft release（body 预填 commit subject），
          # gh release create 会复用该 draft 发布，导致 --notes-file 不生效，这里先删除。
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft' 2>/dev/null | grep -q '^true$'; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null
            echo "Removed auto-created draft release for ${GITHUB_REF_NAME}"
          fi
          if [[ "${GITHUB_REF_NAME}" == *-extension ]]; then
            DEFAULT_NOTES="Chrome extension and skill update only. npm packages are unchanged."
          else
            DEFAULT_NOTES="Rust/npm native release for macOS, Linux, and Windows. Verify assets against SHA256SUMS."
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            EXISTING_NOTES="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body // ""')"
            # 重跑发布时也要把「签名状态」补进 notes：既有正文里已经提到 SH56SUMS 就视为已说明。
            {
              printf '%s\n' "${EXISTING_NOTES}"
              if [ -n "${TAG_MESSAGE}" ] && ! grep -Fq "${TAG_MESSAGE}" <<<"${EXISTING_NOTES}"; then
                printf '\n%s\n' "${TAG_MESSAGE}"
              fi
              if ! grep -Fq "SHA256SUMS" <<<"${EXISTING_NOTES}"; then
                printf '\n%s\n' "${verification_note}"
              fi
            } > release-notes.md
            if [ "$(cat release-notes.md)" != "${EXISTING_NOTES}" ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --notes-file release-notes.md
            fi
            gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            if [ -n "${TAG_MESSAGE}" ]; then
              printf '%s\n' "${TAG_MESSAGE}" > release-notes.md
            else
              printf '%s\n' "${DEFAULT_NOTES}" > release-notes.md
            fi
            printf '\n%s\n' "${verification_note}" >> release-notes.md
            release_flags=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi

  mirror-sync:
    name: Sync npmmirror
    # Chrome 扩展标签不发 npm 包，不需要同步镜像
    if: ${{ !contains(github.ref_name, '-extension') }}
    needs: publish-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Trigger npmmirror sync
        shell: bash
        run: |
          set -euo pipefail
          # 淘宝镜像按包独立抓取上游，历史上出现过单个平台子包漏抓（win32-x64@0.3.7）。
          # 主包 optionalDependencies 强制要求同一版本，子包缺失时 npm 会静默跳过该依赖，
          # 于是 Windows 用户安装"成功"、运行时才报 native binary not found。
          # 包清单来自 scripts/platforms.json，不再手抄一份。
          mapfile -t packages < <(node scripts/platforms.mjs --npm-packages)
          for pkg in "${packages[@]}"; do
            encoded="${pkg//\//%2F}"
            triggered=0
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' -X PUT \
                -H 'Content-Type: application/json' -d '{}' \
                "https://registry.npmmirror.com/-/package/${encoded}/syncs")
              if [[ "${code}" == 2* ]]; then
                echo "${pkg}: 已入队 $(cat /tmp/sync.json)"
                triggered=1
                break
              fi
              echo "${pkg}: HTTP ${code}，第 ${attempt} 次触发失败"
              sleep 5
            done
            if [[ "${triggered}" != 1 ]]; then
              echo "::warning::${pkg} 触发镜像同步失败，可稍后手动重试"
            fi
          done

      - name: Wait for npmmirror to serve the new version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mapfile -t packages < <(node scripts/platforms.mjs --npm-packages)
          summary='/tmp/mirror-sync.md'
          printf '| 包 | 结果 |\n|---|---|\n' > "${summary}"
          failed=0
          for pkg in "${packages[@]}"; do
            synced=0
            # 镜像同步实测约 2 分钟落库，最多等 5 分钟（10 次 x 30s）
            for attempt in $(seq 1 10); do
              if [[ "$(npm view "${pkg}@${version}" version --registry=https://registry.npmmirror.com 2>/dev/null || true)" == "${version}" ]]; then
                synced=1
                break
              fi
              sleep 30
            done
            if [[ "${synced}" == 1 ]]; then
              echo "${pkg}@${version} 镜像已同步"
              printf '| %s | 已同步 |\n' "${pkg}" >> "${summary}"
            else
              echo "::warning::${pkg}@${version} 等待 5 分钟仍未出现在 npmmirror，稍后会自行重试"
              printf '| %s | 未确认（镜像可能延迟） |\n' "${pkg}" >> "${summary}"
              failed=1
            fi
          done
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          # 镜像状态不影响发布结果，只告警不失败
          if [[ "${failed}" == 1 ]]; then
            echo "::warning::部分包在 npmmirror 上未确认同步，建议手动检查"
          fi
