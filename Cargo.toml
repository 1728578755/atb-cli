[package]
name = "atb"
version = "0.8.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "atb"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# 只为 config 的「真原子替换」（MoveFileExW）而加；windows-sys 已经在依赖图里
# （tokio/mio 的传递依赖），所以这里不会新增下载，也不明显增加体积。
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json", "ws"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
dunce = "1.0"
fs2 = "0.4"
html5ever = "0.27"
libc = "0.2"
markup5ever_rcdom = "0.3"
path-clean = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
